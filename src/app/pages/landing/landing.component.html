<div class="landing-container">
  <!-- Audio Control Button -->
  <app-audio-control />
  
  <div class="stars-background">
    <!-- Background decorative stars (all 100) -->
    @for (star of generateStars(); track star) {
      <div class="star" 
           [style.left.%]="(star * 7.3) % 100" 
           [style.top.%]="(star * 11.7) % 100"
           [style.animation-delay.s]="(star * 0.05) % 3">
      </div>
    }
    
    <!-- Clickable golden stars (one per memory, positioned outside content area) -->
    @for (memory of memories; track memory.id; let i = $index) {
      <div class="clickable-star" 
           [class.unlocked]="memory.unlocked"
           [style.left.%]="getClickableStarPosition(i).x" 
           [style.top.%]="getClickableStarPosition(i).y"
           [style.animation-delay.s]="i * 0.3"
           (click)="onStarClick(i)">
        ✦
      </div>
    }
  </div>

  <div class="content">
    <h1 class="landing-title">A Journey Through Time</h1>
    <p class="landing-subtitle">
      Every star holds a memory.<br>
      Every memory tells our story.
    </p>
    
    <button mat-raised-button 
            class="start-button" 
            (click)="startJourney()">
      <mat-icon>auto_awesome</mat-icon>
      Begin the Journey
    </button>
  </div>

  <div class="scroll-hint" (click)="scrollToContent()">
    <mat-icon class="pulse">expand_more</mat-icon>
    <span class="hint-text">Explore</span>
  </div>
</div>
